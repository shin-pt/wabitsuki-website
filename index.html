<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>和日月（わびつき）｜ホームページ準備中</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #3A2820;
            --color-gold: #C4A265;
            --color-bg: #F9F6F0;
            --color-text: #3A2F28;
            --color-text-muted: #8E8478;
            --color-border: #E0D8CA;
            --color-line: #06C755;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: var(--color-bg);
            color: var(--color-text);
            font-family: 'Noto Sans JP', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            text-align: center;
            line-height: 1.9;
        }
        main { max-width: 480px; width: 100%; }
        .name {
            font-family: 'Noto Serif JP', serif;
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            color: var(--color-primary);
        }
        .kana {
            font-size: 0.85rem;
            letter-spacing: 0.3em;
            color: var(--color-gold);
            margin-top: 4px;
        }
        .rule {
            width: 48px;
            height: 1px;
            background: var(--color-gold);
            margin: 32px auto;
        }
        .message {
            font-family: 'Noto Serif JP', serif;
            font-size: 1.05rem;
        }
        .sub {
            font-size: 0.875rem;
            color: var(--color-text-muted);
            margin-top: 12px;
        }
        .line-btn {
            display: inline-block;
            margin-top: 36px;
            padding: 14px 32px;
            border-radius: 999px;
            background: var(--color-line);
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .line-btn:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <main>
        <h1 class="name">和日月</h1>
        <p class="kana">わびつき</p>
        <div class="rule"></div>
        <p class="message">ただいまホームページを準備中です。</p>
        <p class="sub">公開まで今しばらくお待ちください。<br>ご予約・お問い合わせはLINEにて承っております。</p>
        <a class="line-btn" href="https://line.me/R/ti/p/@237kyhbi" target="_blank" rel="noopener">LINEで予約・お問い合わせ</a>
    </main>
</body>
</html>
